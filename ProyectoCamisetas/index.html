<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Vintage</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Tienda Vintage</h1>

    <select id="selectColeccion">
      <option value="">Colecciones</option>
      <option value="Retro">Retro</option>
      <option value="Urban">Urban</option>
    </select>

    <input type="text" id="inputBuscar" placeholder="Buscar...">

    <button id="botonLogin">Login</button>
    <button id="botonPerfil">Perfil</button>
    <button id="botonCarrito">🛒</button>
  </header>

  <main>
    <div class="producto" data-nombre="Camiseta Retro" data-descripcion="Camiseta del Real Sporting año 1999" data-coleccion="Retro">
      <img src="https://camisetasfutbolmania.com/48051-large_default/camiseta-futbol-sporting-de-gijon-primera-equipacion-retro-clasica-2001-2002.jpg" alt="Camiseta Retro Futbol">
      <h3>Camiseta Retro</h3>
      <p>169.99€</p>
      <button class="btn-detalle">Detalles</button>
      <button class="btn-agregar">Agregar</button>
    </div>

    <div class="producto" data-nombre="Sudadera Urban" data-descripcion="Sudadera negra conmemorativa del año 2006" data-coleccion="Urban">
      <img src="https://store.realsporting.com/cdn/shop/files/Mp1_9a6355e4-7ba7-4283-b2e5-dfd400c0c39d.jpg?v=1740514364&width=1400" alt="Sudadera Urban">
      <h3>Sudadera Urban</h3>
      <p>74.95€</p>
      <button class="btn-detalle">Detalles</button>
      <button class="btn-agregar">Agregar</button>
    </div>
  </main>

  <div id="modalDetalles" class="modal">
    <div class="contenido">
      <span class="cerrar" data-close>&times;</span>
      <img id="imgDetalle" alt="">
      <h2 id="tituloDetalle"></h2>
      <p id="descripcionDetalle"></p>
      <p id="precioDetalle"></p>
    </div>
  </div>

  <div id="modalCarrito" class="modal">
    <div class="contenido">
      <span class="cerrar" data-close>&times;</span>
      <h2>Carrito</h2>
      <div id="itemsCarrito"></div>
      <p>Total: <span id="totalCarrito">0.00€</span></p>
      <button id="botonVaciarCarrito">Vaciar Carrito</button>
    </div>
  </div>
>
  <div id="modalLogin" class="modal">
    <div class="contenido">
      <span class="cerrar" data-close>&times;</span>
      <h2>Iniciar sesión</h2>
      <form id="formLogin">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <div id="modalPerfil" class="modal">
    <div class="contenido">
      <span class="cerrar" data-close>&times;</span>
      <h2>Editar perfil</h2>
      <form id="formPerfil">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="apellidos" placeholder="Apellidos" required>
        <input type="email" name="email" placeholder="Correo" required>
        <input type="tel" name="telefono" placeholder="Teléfono">
        <button type="submit">Guardar</button>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
